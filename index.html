<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In My Backyard</title>
<meta name="description" content="How your Texas county is doing on power, drought and data centers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F3; --surface:#FFFFFF; --ink:#1D2B2A; --muted:#566664; --line:#D3DBD7;
  --sky:#235F7D;
  --g-a:#1B6E6A; --g-b:#5FA38F; --g-c:#E2B84A; --g-d:#DD7A3A; --g-f:#B5402F; --g-none:#CDD5D1;
  --display:"Archivo",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--body);overflow-x:clip}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
.site-header{border-bottom:1px solid var(--line);background:var(--paper)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.wordmark{font:800 1.35rem/1 var(--display);font-stretch:112%;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.wordmark span{color:var(--g-a)}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
nav a{display:block;padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav a:hover:not([aria-current="page"]){background:#E3E9E6}

main.wrap{padding-top:28px;padding-bottom:72px}
main:focus{outline:none}
.home-map svg{max-height:70vh}
#big-map{width:100vw;margin-left:calc(50% - 50vw);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#big-map svg{width:100%;height:auto}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0}
h1{font-weight:800;font-stretch:100%;font-size:clamp(2.3rem,6vw,4rem);letter-spacing:-.02em}
h2{font-weight:750;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.01em}
h3{font-weight:700;font-size:1.2rem}
.lede{font-size:1.15rem;color:var(--muted);max-width:38em;margin:14px 0 0}

/* search */
.search{margin-top:28px;max-width:560px}
.search label{display:block;font-weight:600;margin-bottom:8px}
.search-row{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:14px 16px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{font:700 1rem var(--body);padding:12px 20px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-block}
.btn-quiet{background:transparent;color:var(--ink)}
.search-msg{margin:10px 0 0;min-height:1.5em;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.choices button{font:600 .95rem var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--ink);background:var(--surface);cursor:pointer}
.try{margin-top:14px;color:var(--muted);font-size:.95rem}
.try a{font-weight:600}

/* home layout */
.home-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:860px){.home-grid{grid-template-columns:1fr}}
.home-map figcaption{font-size:.9rem;color:var(--muted);margin-top:6px}

/* map */
.map-box{position:relative}
.map-box svg{width:100%;height:auto;display:block}
.map-box .sea{fill:#FAFBFA}
.around path{fill:#ECEFEC;stroke:#CDD5D1;stroke-width:.8}
.cities{pointer-events:none}
.cities circle{fill:var(--ink)}
.cities text{font:600 14px var(--body);fill:var(--ink);paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3px;stroke-linejoin:round}
.county{stroke:#fff;stroke-width:.5;cursor:pointer;transition:opacity .12s}
.county:hover,.county.is-active{stroke:var(--ink);stroke-width:1.6}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 6px 18px rgba(29,43,42,.16);font-size:.9rem;min-width:190px;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;z-index:5}
.tip.show{opacity:1;transform:none}
.tip strong{display:block;font:750 1.05rem var(--display);margin-bottom:6px}
.tip dl{display:grid;grid-template-columns:auto auto;gap:3px 14px;margin:0}
.tip dt{color:var(--muted)} .tip dd{margin:0;font-weight:700;text-align:right}
.tip .hint{margin-top:8px;color:var(--muted);font-size:.8rem}

.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:14px 0 0;padding:0;list-style:none;font-size:.9rem}
.legend li{display:flex;align-items:center;gap:6px}
.swatch{width:16px;height:16px;border-radius:3px;display:inline-block}

.layer-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin:22px 0 8px}
.layer-pick{display:flex;flex-wrap:wrap;gap:6px}
.layer-row .map-note{flex:1 1 260px;margin:0;padding-left:16px;border-left:1px solid var(--line);max-width:44em}
.layer-pick button{font:600 .95rem var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.layer-pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.map-note{color:var(--muted);font-size:.95rem;margin:6px 0 0}

/* grade stamp */
.grade{font-family:var(--display);font-weight:900;font-stretch:62%;line-height:.82;letter-spacing:-.02em;color:var(--gc,var(--muted))}
.grade-none{font-weight:700;font-stretch:100%;font-size:1rem!important;line-height:1.3;color:var(--muted)}

/* county report */
.back{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;padding:7px 14px;border:1.5px solid var(--g-a);border-radius:999px;background:var(--surface);color:var(--g-a);font:600 .92rem var(--body);text-decoration:none;transition:background .15s,color .15s}
.back::before{content:"\2190";font-size:1rem;line-height:1}
.back:hover{background:var(--g-a);color:#fff}
.report-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:24px;border-bottom:3px solid var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px 24px;margin:12px 0 0;padding:0;list-style:none;color:var(--muted)}
.facts b{color:var(--ink)}
.overall{text-align:center}
.overall .grade{font-size:clamp(4.5rem,11vw,7rem);color:var(--ink)}
.overall p{margin:8px 0 0;font-size:.9rem;color:var(--muted);max-width:14em}
.overall p b{display:block;color:var(--ink);font-weight:700}
.overall .basis{display:block;margin-top:4px}
@media (max-width:600px){.report-head{grid-template-columns:1fr}.overall{text-align:left}}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
@media (max-width:860px){.cats{grid-template-columns:1fr}}
.cat{padding:24px;border-radius:12px;background:var(--cat-bg,var(--surface));border:1px solid var(--cat-line,var(--line))}
.cat-power{--cat-bg:#FBF3DC;--cat-line:#EFDDA8}
.cat-drought{--cat-bg:#E7F1EC;--cat-line:#C7DFD4}
.cat-datacenters{--cat-bg:#FCEDE3;--cat-line:#F2CFB7}
@media (max-width:860px){.cat{padding:20px}}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cat .grade{font-size:4.6rem}
.cat dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:18px 0 0}
.cat dt{color:var(--muted)} .cat dd{margin:0;font-weight:700;text-align:right}
.means{margin:18px 0 0;padding:14px 16px;background:var(--surface);border-left:4px solid var(--gc,var(--line));border-radius:0 6px 6px 0}
.means h4{margin:0 0 4px;font:700 .95rem var(--body)}
.means p{margin:0}
.parts{list-style:none;margin:18px 0 0;padding:0}
.parts li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.parts .grade{font-size:2.2rem}
.pending{color:var(--muted);font-size:.95rem;margin:14px 0 0}
.dc-none{margin:18px 0 0;font-weight:700}
.dc-lookup{margin:10px 0 0;color:var(--ink)}
.dc-lookup a{color:var(--g-a);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--g-a) 35%,transparent);text-underline-offset:4px;transition:text-decoration-color .15s}
.dc-lookup a:hover{text-decoration-color:var(--g-a)}
.dc-lookup .ext{display:inline-block;margin-left:2px;font-size:.8em;text-decoration:none}
.tt-hint{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.dc-list{list-style:none;margin:16px 0 0;padding:0}
.dc-list li{padding:12px 0;border-top:1px solid var(--line)}
.dc-list h4{margin:0;font:750 1.05rem var(--display)}
.dc-list p{margin:4px 0 0;font-size:.92rem}
.dc-status{color:var(--ink)} .dc-src{color:var(--muted)}
.dc-list .dc-phases{list-style:disc;margin:2px 0 6px;padding-left:20px}
.dc-list .dc-phases li{padding:2px 0;border:0;font-size:.92rem}
.dc-src a{color:var(--muted)}
.dc-dot{stroke:var(--ink);stroke-width:1.5;cursor:pointer}
.dc-dot.is-operating{fill:var(--ink)} .dc-dot.is-coming{fill:#fff}
.dc-dot:hover{stroke-width:3}
.dr-tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.92rem;white-space:nowrap}
.dr-tag::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--dc);border:1px solid rgba(0,0,0,.15)}
.drought{margin-top:20px}
.drought .dr-now{margin:0 0 8px}
.drought .dr-now .dr-tag{font:750 1.2rem var(--display)}
.drought .dr-now .dr-tag::before{width:16px;height:16px}
.drought h4{margin:0 0 4px;font:700 .95rem var(--display)}
.drought p{margin:0;font-size:.95rem}
.dr-bar{display:flex;height:14px;margin:12px 0 10px;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.dr-bar span{display:block;height:100%}
.dr-key{list-style:none;margin:0;padding:0;font-size:.88rem}
.dr-key li{display:flex;align-items:center;gap:8px;padding:2px 0}
.dr-key b{margin-left:auto}
.dr-key .swatch{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.drought .dr-src{margin-top:10px;font-size:.82rem;color:var(--muted)}
.legend .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.legend .dot-coming{background:#fff} .legend .dot-operating{background:var(--ink)}

.section{margin-top:56px}
.stories{list-style:none;margin:0;padding:0}
.stories a{text-decoration:none;color:var(--ink)}
.stories a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.stories .meta{color:var(--muted);font-size:.86rem;margin-top:6px}
.kicker{display:block;margin-bottom:6px;font:800 .74rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--k,var(--g-a))}
.kicker .pick{color:var(--muted);font-weight:700;letter-spacing:.06em}
[data-cat="Power"]{--k:#A77E12;--k-bg:#FBF3DC}
[data-cat="Water"],[data-cat="Drought"],[data-cat="Environment"]{--k:var(--g-a);--k-bg:#E7F1EC}
[data-cat="Data centers"]{--k:#B85A1E;--k-bg:#FCEDE3}
#stories h2.ruled{padding-bottom:12px;border-bottom:1px dotted var(--ink)}
.news-main .lede{margin:0 0 18px}
.news{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:40px;margin-top:22px}
.news-main{min-width:0}
.lead-story{padding:28px 28px 26px;border-radius:12px;background:var(--k-bg,var(--surface));border-left:6px solid var(--k,var(--g-a))}
.lead-story a{font:800 clamp(1.5rem,3vw,2.05rem)/1.15 var(--display);letter-spacing:-.01em}
.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin-top:8px}
.story-grid li{padding:18px 0;border-bottom:1px solid var(--line)}
.story-grid a{font:700 1.08rem/1.3 var(--display)}
.news-side{background:var(--surface);border-top:3px solid var(--ink);border-radius:0 0 12px 12px;padding:16px 20px 6px;align-self:start}
.news-side li.last{border-bottom:0}
.news-side h3{margin:0 0 4px;font:800 .82rem var(--display);letter-spacing:.08em;text-transform:uppercase}
.tx-filter{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.tx-filter button{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;font:600 .82rem var(--body);color:var(--ink);cursor:pointer}
.tx-filter button:hover{border-color:var(--g-a);color:var(--g-a)}
.tx-filter button[aria-pressed="true"]{background:var(--g-a);border-color:var(--g-a);color:#fff}
.news-side ol{list-style:none;margin:0;padding:0;counter-reset:n}
.news-side li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;padding:14px 0;border-bottom:1px solid var(--line)}
.news-side li>*{grid-column:2}
.news-side li[hidden]{display:none}
.news-side li::before{grid-row:1 / span 3;content:counter(n);font:800 1.6rem/1 var(--display);color:var(--k,var(--g-a))}
.news-side a{font:700 1rem/1.3 var(--display)}
.news-side .kicker{margin-bottom:4px}
.news-wide{display:block}
.news-wide .empty{margin-bottom:26px}
.news-side.wide ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.news-side.wide li.first{grid-column:1 / -1;margin:6px 0 4px;padding:24px 26px 22px;border:0;border-left:6px solid var(--k,var(--g-a));border-radius:12px;background:var(--k-bg,var(--surface))}
.news-side.wide li.first a{font:800 clamp(1.35rem,2.6vw,1.8rem)/1.18 var(--display)}
.news-side.wide li a{font-size:1.08rem}
@media (max-width:820px){.news{grid-template-columns:1fr;gap:28px}}
@media (max-width:560px){.news-side.wide ol{grid-template-columns:1fr}}
@media (max-width:560px){.story-grid{grid-template-columns:1fr}.lead-story{padding:22px 20px}}
.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin-top:18px}
.tags{display:flex;gap:6px;margin-bottom:6px}
.tag{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:4px;background:#E3E9E6;color:var(--ink)}
.tag-local{background:var(--g-a);color:#fff}
.locate{margin-top:10px;background:none;border:0;padding:0;font:600 .95rem var(--body);color:var(--sky);text-decoration:underline;cursor:pointer}

/* speak up: side panel with public meetings (map colors) */
.jump{margin-top:18px;display:inline-flex;align-items:center;gap:12px;padding:10px 16px;border:1px solid var(--g-a);border-radius:8px;background:var(--g-a);font:600 .95rem var(--body);color:#fff;cursor:pointer;text-align:left}
.jump b{font-weight:700;color:#fff}
.jump:hover{background:#155956}
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.drawer .scrim{position:absolute;inset:0;background:rgba(29,43,42,.35);opacity:0;transition:opacity .2s}
.drawer .panel{position:relative;width:min(560px,100%);height:100%;overflow-y:auto;background:var(--paper);box-shadow:-12px 0 32px rgba(29,43,42,.18);transform:translateX(100%);transition:transform .25s ease-out;outline:none}
.drawer.open .scrim{opacity:1}
.drawer.open .panel{transform:none}
.panel-head{position:sticky;top:0;z-index:1;background:var(--g-a);color:#fff;padding:22px 24px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.panel-head h2{color:#fff;font-size:1.6rem}
.panel-head p{margin:6px 0 0;color:#D7EAE3;font-size:.95rem}
.panel-close{flex:none;font:700 1rem var(--body);background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:8px;padding:6px 12px;cursor:pointer}
.panel-close:hover{background:rgba(255,255,255,.12)}
.panel-head :focus-visible{outline-color:#fff}
.panel-body{padding:20px 24px 40px}
.panel-body .lede{font-size:1rem;margin:0}
.bodies{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.body{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--kc,var(--g-a));border-radius:8px;padding:18px 18px 16px}
.body.k-court{--kc:var(--g-a)} .body.k-city{--kc:var(--g-b)} .body.k-water{--kc:var(--sky)}
.body .kind{font-size:.85rem;font-weight:600;color:var(--kc);margin:0 0 2px}
.body h3{font-size:1.15rem}
.body .decides{color:var(--muted);font-size:.92rem;margin:6px 0 0}
.body dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}
.body dt{color:var(--muted)} .body dd{margin:0}
.body .next{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:4px;background:var(--g-c);color:var(--ink);font-weight:700;font-size:.88rem}
.body .links{padding-top:14px;display:flex;flex-wrap:wrap;gap:8px 16px;font-weight:600;font-size:.95rem}
.how{margin-top:28px;padding-top:20px;border-top:3px solid var(--ink)}
.how h3{font-size:1.1rem;margin-bottom:10px}
.how ol{margin:0;padding-left:1.2em}
.how li{margin:0 0 10px;color:var(--muted)} .how li b{color:var(--ink)}
.panel .fine{margin:18px 0 0;color:var(--muted);font-size:.88rem}
body.drawer-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){.drawer .panel,.drawer .scrim{transition:none}}

/* compare */
.compare-pick{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:22px}
.compare-pick label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.compare-pick select{font:inherit;padding:10px 12px;border-radius:8px;border:2px solid var(--ink);background:var(--surface);min-width:200px}
table.cmp{width:100%;border-collapse:collapse;margin-top:24px;background:var(--surface)}
.cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
.cmp thead th{font:750 1.15rem var(--display)}
.cmp td .grade{font-size:2.4rem}

/* data centers 101 */
.guides h2.ruled{padding-bottom:12px;border-bottom:1px dotted var(--ink)}
.guide-list{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.guide-list li{padding:18px 0;border-bottom:1px solid var(--line)}
.guide-list a{font:700 1.08rem/1.3 var(--display);color:var(--ink);text-decoration:none}
.guide-list a:hover{text-decoration:underline}
.guide-list .ext{font-size:.8em;margin-left:3px;color:var(--g-a)}
.guide-list p{margin:6px 0;color:var(--ink)}
.guide-list .meta{color:var(--muted);font-size:.86rem}
.guide-type{display:block;margin-bottom:4px;font:800 .72rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:#B85A1E}
@media (max-width:640px){.guide-list{grid-template-columns:1fr}}
/* faq/about */
.see-all a{color:var(--ink);text-decoration:none;font-weight:600}
.see-all a:hover{text-decoration:underline}
.faq-list{margin:6px 0 12px;padding-left:20px}
.faq-list li{margin:4px 0}
.prose{max-width:44em}
.prose p{margin:12px 0}
details{border-top:1px solid var(--line);padding:16px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{font:700 1.15rem var(--display);cursor:pointer}
details p{margin:10px 0 0;max-width:42em}

.site-footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.9rem}
.loading{color:var(--muted)}
.error{padding:16px;border-left:4px solid var(--g-f);background:var(--surface)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="#/">In My <span>Backyard</span></a>
    <nav aria-label="Main"><ul>
      <li><a href="#/" data-nav="home">Home</a></li>
      <li><a href="#/map" data-nav="map">Map</a></li>
      <li><a href="#/compare" data-nav="compare">Compare</a></li>
      <li><a href="#/learn" data-nav="learn">Data centers 101</a></li>
      <li><a href="#/faq" data-nav="faq">FAQ</a></li>

/* ============================================================
   Below here: how the site works
   ============================================================ */
const GRADE_COLORS = { A: "var(--g-a)", B: "var(--g-b)", C: "var(--g-c)", D: "var(--g-d)", F: "var(--g-f)" };
const GRADE_HEX = { A: "#1B6E6A", B: "#5FA38F", C: "#E2B84A", D: "#DD7A3A", F: "#B5402F", none: "#CDD5D1" };
const POINTS = { A: 4, B: 3, C: 2, D: 1, F: 0 };
const state = { counties: [], byName: new Map(), byFips: new Map(), zips: {}, topo: null, stories: [], layer: "overall" };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const norm = s => String(s || "").toLowerCase().replace(/\s+county$/, "").trim();
const fmt = v => (typeof v === "number" ? v.toLocaleString("en-US") : (v ?? ""));

function findCol(headers, name) {
  const n = name.toLowerCase();
  return headers.find(h => h.toLowerCase() === n) || headers.find(h => h.toLowerCase().startsWith(n));
}
function letter(v) { const m = String(v || "").trim().toUpperCase().match(/^[ABCDF]/); return m ? m[0] : null; }
// Average of grade points -> letter with + or -. A whole number gives a plain letter (one B = "B").
function toLetterPlusMinus(avg) {
  const whole = Math.round(avg), diff = avg - whole;
  const base = ["F", "D", "C", "B", "A"][whole];
  if (base === "F") return "F";
  if (diff >= 0.17 && base !== "A") return base + "+";
  if (diff <= -0.17) return base + "-";
  return base;
}

async function load() {
  const [buf, topo, zips] = await Promise.all([
    fetch(CONFIG.dataUrl, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("spreadsheet"); return r.arrayBuffer(); }),
    fetch("data/tx-counties.json").then(r => r.json()),
    fetch("data/tx-zips.json").then(r => r.json()),
  ]);
  state.topo = topo; state.zips = zips;
  // Gray background of neighboring states and Mexico (optional; the map works without it)
  state.around = await fetch("data/surroundings.json").then(r => r.ok ? r.json() : null).catch(() => null);
  const wb = XLSX.read(buf, { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
  const headers = rows.length ? Object.keys(rows[0]) : [];
  const col = k => findCol(headers, k);
  const cCounty = col(CONFIG.columns.county);

  const fipsByName = new Map(topo.objects.counties.geometries.map(g => [norm(g.properties.name), g.id]));
  for (const r of rows) {
    const name = r[cCounty]; if (!name || !String(name).trim()) continue;
    const c = { name: String(name).trim(), population: r[col(CONFIG.columns.population)], area: r[col(CONFIG.columns.area)], cats: {} };
    c.slug = slug(c.name); c.fips = fipsByName.get(norm(c.name));
    for (const cat of CONFIG.categories) {
      const entry = { grade: null, facts: [], parts: [] };
      const gc = cat.grade && col(cat.grade);
      if (gc) entry.grade = letter(r[gc]);
      for (const [label, k] of cat.facts || []) { const fc = col(k); if (fc && r[fc] != null && r[fc] !== "") entry.facts.push([label, r[fc]]); }
      for (const [label, k] of cat.parts || []) { const pc = col(k); entry.parts.push([label, pc ? letter(r[pc]) : null]); }
      // a category with sub-parts but no grade of its own: average the parts
      if (!entry.grade && entry.parts.some(p => p[1])) {
        const g = entry.parts.filter(p => p[1]).map(p => POINTS[p[1]]);
        entry.grade = toLetterPlusMinus(g.reduce((a, b) => a + b, 0) / g.length)[0];
      }
      c.cats[cat.key] = entry;
    }
    setOverall(c);
    state.counties.push(c); state.byName.set(norm(c.name), c); if (c.fips) state.byFips.set(c.fips, c);
  }
  state.counties.sort((a, b) => a.name.localeCompare(b.name));
  $("#county-list").innerHTML = state.counties.map(c => `<option value="${esc(c.name)} County">`).join("");

  // Data center sites, grouped into campuses ("Meta El Paso - Building 3" -> campus "Meta El Paso")
  state.dcSites = []; state.dcCampuses = [];
  for (const tab of wb.SheetNames.filter(n => n.toLowerCase().includes(CONFIG.dataCenters.tabMatch))) {
    const drows = XLSX.utils.sheet_to_json(wb.Sheets[tab], { defval: null });
    const dh = drows.length ? Object.keys(drows[0]) : [], dcol = k => findCol(dh, k), K = CONFIG.dataCenters.columns;
    for (const r of drows) {
      const get = k => { const c = dcol(k); return c ? r[c] : null; };
      const name = get(K.name), county = get(K.county); if (!name || !county) continue;
      state.dcSites.push({
        name: String(name).trim(), campus: String(name).split(/\s+[-–]\s+/)[0].trim(),
        developer: get(K.developer) || "", status: String(get(K.status) || "Unknown").trim(),
        year: get(K.year) ? Math.round(+get(K.year)) : null, mw: +get(K.mw) || 0, investment: +get(K.investment) || 0,
        county: String(county).trim(), lat: +get(K.lat), lon: +get(K.lon),
        sources: K.sources.map(get).filter(s => s && /^https?:/.test(s)),
      });
    }
  }
  const campusMap = new Map();
  for (const s of state.dcSites) {
    const k = norm(s.county) + "|" + s.campus;
    if (!campusMap.has(k)) campusMap.set(k, { name: s.campus, county: s.county, developer: s.developer, sites: [] });
    campusMap.get(k).sites.push(s);
  }
  for (const cp of campusMap.values()) {
    const pts = cp.sites.filter(s => isFinite(s.lat) && isFinite(s.lon) && s.lat && s.lon);
    cp.lat = pts.length ? pts.reduce((a, s) => a + s.lat, 0) / pts.length : null;
    cp.lon = pts.length ? pts.reduce((a, s) => a + s.lon, 0) / pts.length : null;
    cp.mw = cp.sites.reduce((a, s) => a + s.mw, 0);
    cp.investment = cp.sites.reduce((a, s) => a + s.investment, 0);
    cp.operating = cp.sites.some(s => /operat/i.test(s.status));
    cp.sources = [...new Set(cp.sites.flatMap(s => s.sources))];
    state.dcCampuses.push(cp);
  }
  for (const c of state.counties) c.cats.datacenters.campuses = state.dcCampuses.filter(cp => norm(cp.county) === norm(c.name));

  // Drought status per county (cumulative percents: D1 = share of land in moderate drought or worse)
  const dtab = wb.SheetNames.find(n => n.toLowerCase().includes(CONFIG.drought.tabMatch));
  state.droughtDate = null;
  if (dtab) {
    const drows = XLSX.utils.sheet_to_json(wb.Sheets[dtab], { defval: null });
    const dh = drows.length ? Object.keys(drows[0]) : [], dcol = k => findCol(dh, k), K = CONFIG.drought.columns;
    for (const r of drows) {
      const c = state.byName.get(norm(r[dcol(K.county)])); if (!c) continue;
      const cum = [100, ...K.levels.map(l => Math.max(0, Math.min(100, +r[dcol(l)] || 0)))];
      c.drought = { cum, level: Math.max(...cum.map((v, i) => v >= 50 ? i : 0)), worst: Math.max(...cum.map((v, i) => v >= 1 ? i : 0)) };
      if (!c.cats.drought.grade) { c.cats.drought.grade = CONFIG.drought.grades[c.drought.level]; setOverall(c); }
      const m = /^(\d{4})(\d{2})(\d{2})$/.exec(String(Math.round(+r[dcol(K.date)] || 0)));
      if (m && !state.droughtDate) state.droughtDate = new Date(+m[1], m[2] - 1, +m[3]);
    }
  }

  const st = wb.SheetNames.find(n => n.toLowerCase() === CONFIG.storiesTab.toLowerCase());
  if (st) state.stories = XLSX.utils.sheet_to_json(wb.Sheets[st], { defval: "" }).filter(s => s.Title);

  // Neighboring counties (for "nearby" stories)
  const geoms = topo.objects.counties.geometries, nb = topojson.neighbors(geoms);
  state.neighbors = new Map(geoms.map((g, i) => [g.id, nb[i].map(j => geoms[j].id)]));

  // Found stories and local outlets (made by scripts/fetch_stories.py). The site still works without them.
  const opt = u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
  const optXlsx = u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
  let mbuf;
  [state.news, state.outlets, mbuf] = await Promise.all([opt("data/stories.json"), opt("data/outlets.json"), optXlsx(CONFIG.meetingsUrl)]);
  state.meetings = new Map();
  if (mbuf) {
    const mwb = XLSX.read(mbuf, { type: "array" });
    for (const m of XLSX.utils.sheet_to_json(mwb.Sheets[mwb.SheetNames[0]], { defval: "" })) {
      if (!m.County || !m.Name) continue;
      const k = norm(m.County);
      if (!state.meetings.has(k)) state.meetings.set(k, []);
      state.meetings.get(k).push(m);
    }
  }
}

/* ---------- small pieces ---------- */
function gradeEl(g, cls = "") {
  if (!g) return `<span class="grade grade-none ${cls}">Not graded yet</span>`;
  return `<span class="grade ${cls}" style="--gc:${GRADE_COLORS[g[0]]}" aria-label="Grade ${g}">${esc(g)}</span>`;
}
function layerGrade(c, layer) {
  if (!c) return null;
  return layer === "overall" ? c.overall : c.cats[layer]?.grade;
}

/* ---------- map ---------- */
function drawMap(el, { interactive = true, height = 0 } = {}) {
  const geo = topojson.feature(state.topo, state.topo.objects.counties);
  // The big map stretches across the whole page; its drawing gets wider (not taller) on wide screens
  const H = height || 760, shownH = Math.min(760, innerHeight * 0.8);
  const W = interactive ? Math.round(Math.max(800, Math.min(1800, H * el.clientWidth / shownH))) : 800, pad = interactive ? 28 : 0;
  const proj = d3.geoConicEqualArea().parallels([27.5, 35]).rotate([100, 0]).fitExtent([[pad, pad], [W - pad, H - pad]], geo);
  const path = d3.geoPath(proj);
  el.innerHTML = `<div class="map-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of Texas counties colored by grade"></svg><div class="tip" role="status"></div></div>`;
  const svg = d3.select(el).select("svg"), tip = $(".tip", el), box = $(".map-box", el);
  // Background like a reference map: light sea, neighboring states and Mexico in flat gray with thin borders
  // (only on the full map page; the home page shows Texas by itself)
  if (interactive) svg.append("rect").attr("class", "sea").attr("width", W).attr("height", H);
  if (interactive && state.around) svg.append("g").attr("class", "around").attr("aria-hidden", "true")
    .selectAll("path").data(state.around.features).join("path").attr("d", path);
  const paths = svg.append("g").selectAll("path").data(geo.features).join("path")
    .attr("class", "county").attr("d", path);
  const paint = () => paths.attr("fill", f => {
    const c = state.byFips.get(f.id);
    if (state.layer === "drought") return c?.drought ? DROUGHT[c.drought.level].color : GRADE_HEX.none;
    const g = layerGrade(c, state.layer); return g ? GRADE_HEX[g[0]] : GRADE_HEX.none;
  });
  paint();
  if (!interactive) { paths.on("click", (e, f) => { const c = state.byFips.get(f.id); if (c) location.hash = `#/county/${c.slug}`; }); return { paint }; }

  const show = (e, f) => {
    const c = state.byFips.get(f.id); if (!c) return;
    paths.classed("is-active", d => d === f);
    const rows = [["Overall", c.overall], ...CONFIG.categories.map(k => [k.label, k.key === "drought" && !c.cats[k.key].grade && c.drought ? DROUGHT[c.drought.level].label : c.cats[k.key].grade])];
    tip.innerHTML = `<strong>${esc(c.name)} County</strong><dl>${rows.map(([l, g]) => `<dt>${l}</dt><dd>${g ? esc(g) : "—"}</dd>`).join("")}</dl><div class="hint">Click to see the full report</div>`;
    const r = box.getBoundingClientRect();
    let x = e.clientX - r.left + 16, y = e.clientY - r.top + 16;
    if (x + 220 > r.width) x = e.clientX - r.left - 220;
    if (y + 190 > r.height) y = e.clientY - r.top - 190;
    tip.style.left = Math.max(0, x) + "px"; tip.style.top = Math.max(0, y) + "px"; tip.classList.add("show");
  };
  paths.on("mousemove", show)
    .on("mouseleave", () => { tip.classList.remove("show"); paths.classed("is-active", false); })
    .on("click", (e, f) => { const c = state.byFips.get(f.id); if (c) location.hash = `#/county/${c.slug}`; });

  // City labels to help people find their area
  if (interactive) { const cities = svg.append("g").attr("class", "cities").attr("aria-hidden", "true")
    .selectAll("g").data(CITIES).join("g").attr("transform", d => `translate(${proj([d[1], d[2]])})`);
  cities.append("circle").attr("r", 2.2);
  cities.append("text").attr("x", 5).attr("y", d => d[3] || 4).text(d => d[0]); }

  // Data center dots: one per campus, sized by power use. Filled = operating, hollow = not open yet.
  const camps = state.dcCampuses.filter(cp => cp.lat != null);
  const maxMw = d3.max(camps, cp => cp.mw) || 1;
  const rScale = d3.scaleSqrt().domain([0, maxMw]).range([4, 13]);
  svg.append("g").selectAll("circle").data(camps.sort((a, b) => b.mw - a.mw)).join("circle")
    .attr("class", cp => `dc-dot ${cp.operating ? "is-operating" : "is-coming"}`)
    .attr("cx", cp => proj([cp.lon, cp.lat])[0]).attr("cy", cp => proj([cp.lon, cp.lat])[1]).attr("r", cp => rScale(cp.mw))
    .on("mousemove", (e, cp) => {
      paths.classed("is-active", false);
      tip.innerHTML = `<strong>${esc(cp.name)}</strong><div>${esc(cp.county)} County</div><div style="margin-top:6px">${cp.sites.length} ${cp.sites.length === 1 ? "building" : "buildings"}:<br>${statusLine(cp.sites).join("<br>")}</div><div style="margin-top:4px">${mwText(cp.mw)}</div><div class="hint">Click to see the county report</div>`;
      const r = box.getBoundingClientRect();

    const y = today.getFullYear(), mo = today.getMonth() + add;

    for (const w of weeks) {

      if (d.getMonth() === new Date(y, mo, 1).getMonth() && d >= today) dates.push(d);

}
const longDate = d => {
  const t = new Date(), s = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  return d.toDateString() === t.toDateString() ? `Today, ${s}` : s;
};
const searchLink = q => `https://www.google.com/search?q=${encodeURIComponent(q)}`;
const TYPE_ORDER = ["commissioners court", "city council", "groundwater district", "subsidence district"];
function meetingsFor(c) {
  return (state.meetings?.get(norm(c.name)) || []).slice()
    .sort((a, b) => (TYPE_ORDER.indexOf(String(a.Type).toLowerCase()) + 1 || 9) - (TYPE_ORDER.indexOf(String(b.Type).toLowerCase()) + 1 || 9));
}
// The soonest meeting we can work out, for the link at the top of the page.
function soonestMeeting(c) {
  return meetingsFor(c).map(m => ({ m, d: nextMeeting(m.Schedule) })).filter(x => x.d).sort((a, b) => a.d - b.d)[0] || null;
}
function bodyCard(m) {
  const type = String(m.Type || "").trim(), t = type.toLowerCase();
  const next = nextMeeting(m.Schedule);
  const when = m.Schedule
    ? `${esc(m.Schedule)}${next ? `<br><span class="next">Next: ${esc(longDate(next))}</span>` : ""}`
    : (t.includes("district") ? "Check the district's website for board meetings and permit hearings." : "Check the agenda page. Agendas are posted at least 72 hours before each meeting.");
  const agenda = m["Agenda link"] || m.Website, site = m.Website;
  const links = [
    agenda ? `<a href="${esc(agenda)}" target="_blank" rel="noopener">${t.includes("district") ? "Visit the website" : "See agendas"}</a>`
           : `<a href="${esc(searchLink(m.Name + " agenda"))}" target="_blank" rel="noopener">Search for agendas</a>`,
    site && agenda && site !== agenda ? `<a href="${esc(site)}" target="_blank" rel="noopener">Main website</a>` : "",
  ].filter(Boolean).join("");
  const covers = m.Covers && !/^whole county$/i.test(m.Covers) ? `<dt>Covers</dt><dd>${esc(m.Covers)}</dd>` : "";
  return `<article class="body ${KIND_CLASS(t)}">
    <p class="kind">${esc(type)}</p><h3>${esc(m.Name)}</h3>
    ${CONFIG.bodyDecides[t] ? `<p class="decides">${esc(CONFIG.bodyDecides[t])}</p>` : ""}
    <dl><dt>When</dt><dd>${when}</dd>${m.Where ? `<dt>Where</dt><dd>${esc(m.Where)}</dd>` : ""}${covers}</dl>
    <div class="links">${links}</div></article>`;
}
const KIND_CLASS = t => /court/.test(t) ? "k-court" : /city/.test(t) ? "k-city" : "k-water";
function speakUpPanel(c) {
  const list = meetingsFor(c);
  if (!list.length) return "";
  const hasCity = list.some(m => /city council/i.test(m.Type));
  return `<div class="drawer" id="speak-up" hidden>
    <div class="scrim" data-close></div>
    <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="speak-title" tabindex="-1">
      <div class="panel-head"><div><h2 id="speak-title">Speak to Your Representatives</h2><p>Public meetings in ${esc(c.name)} County</p></div>
        <button type="button" class="panel-close" data-close>Close</button></div>
      <div class="panel-body">
        <p class="lede">Decisions about power, water and land here get made at these meetings. Anyone can attend, and Texas law lets you speak about any item on the agenda.</p>
        <div class="bodies">${list.map(bodyCard).join("")}</div>
        ${hasCity ? "" : `<p class="fine">The county seat isn't an incorporated city, so it has no city council. The commissioners court is the main local government here.</p>`}
        <div class="how"><h3>How to speak at a meeting</h3><ol>
          <li><b>Find the agenda.</b> It's posted at least 72 hours before the meeting. Look for the item about your issue.</li>
          <li><b>Sign up to speak.</b> Most meetings ask you to fill out a short card or sign-up sheet before public comment. Some also take comments online or by email.</li>
          <li><b>Keep it short.</b> Speakers usually get about three minutes. Say where you live, what you're seeing, and what you want them to do.</li>
        </ol></div>
        <p class="fine">Meeting times come from official websites and can change, especially around holidays. Confirm on the agenda before you go.</p>
      </div>
    </aside></div>`;
}
function jumpHtml(c) {
  if (!meetingsFor(c).length) return "";
  const s = soonestMeeting(c);
  const label = s ? `Speak to Your Representatives. Next meeting: <b>${esc(longDate(s.d))}</b>` : `Speak to Your Representatives`;
  return `<button type="button" class="jump" data-open="#speak-up" aria-haspopup="dialog"><span>${label}</span></button>`;
}
function wirePanel(root) {
  const btn = root.querySelector("[data-open]"); if (!btn) return;
  const d = $(btn.dataset.open), panel = $(".panel", d);
  const close = () => {
    d.classList.remove("open"); document.body.classList.remove("drawer-open");
    document.removeEventListener("keydown", onKey);
    setTimeout(() => { d.hidden = true; }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 250);
    btn.focus();
  };
  const onKey = e => {
    if (e.key === "Escape") return close();
    if (e.key !== "Tab") return;
    const f = [...panel.querySelectorAll("a[href],button")];
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
  };
  btn.onclick = () => {
    d.hidden = false; document.body.classList.add("drawer-open");
    requestAnimationFrame(() => d.classList.add("open"));
    panel.scrollTop = 0; panel.focus();
    document.addEventListener("keydown", onKey);
  };
  d.querySelectorAll("[data-close]").forEach(x => x.onclick = close);
}

function pageCounty(slugv) {
  const c = state.counties.find(x => x.slug === slugv);
  if (!c) return `<h1>County not found</h1><p class="lede">We couldn't find that county. Search for it by name or ZIP code.</p>${searchHtml()}`;
  const basis = c.overall
    ? (c.gradedLabels.length === CONFIG.categories.length ? "Overall grade|Across power, drought and data centers" : `Overall grade|Based on ${c.gradedLabels.join(" and ").toLowerCase()} only, until more data is added.`)
    : "No grades yet for this county";
  return `<a class="back" href="#/map">Back to the map</a>
    <div class="report-head">
      <div><h1>${esc(c.name)} County</h1>
        <ul class="facts">${c.population != null ? `<li><b>${fmt(Math.round(c.population))}</b> people</li>` : ""}${c.area != null ? `<li><b>${fmt(Math.round(c.area))}</b> square miles</li>` : ""}</ul>
        ${jumpHtml(c)}</div>
      <div class="overall">${c.overall ? gradeEl(c.overall) : gradeEl(null)}<p>${basis.split("|").map((t, i) => i ? `<span class="basis">${esc(t)}</span>` : `<b>${esc(t)}</b>`).join("")}</p></div>
    </div>
    <div class="cats">${CONFIG.categories.map(k => catHtml(k, c.cats[k.key], c)).join("")}</div>
    ${speakUpPanel(c)}
    ${storiesSection(c)}
    <section class="section"><h2>Questions people ask</h2>${faqItems().slice(0, 3).join("")}<p class="see-all"><a href="#/faq">See all questions</a></p></section>`;
}

function pageCompare(a, b) {
  const opts = sel => `<option value="">Choose a county</option>` + state.counties.map(c => `<option value="${c.slug}" ${c.slug === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  const A = state.counties.find(c => c.slug === a), B = state.counties.find(c => c.slug === b);
  let table = "";
  if (A && B) {
    const rows = [["Overall", A.overall, B.overall], ...CONFIG.categories.map(k => [k.label, A.cats[k.key].grade, B.cats[k.key].grade])];
    const dcCount = X => (X.cats.datacenters.campuses || []).reduce((a, cp) => a + cp.sites.length, 0);
    const facts = [["People", fmt(Math.round(A.population || 0)), fmt(Math.round(B.population || 0))],
      ...(state.dcSites.length ? [["Data center buildings in our list", dcCount(A), dcCount(B)]] : []), ...CONFIG.categories.flatMap(k => (k.facts || []).map(([l]) => [l, (A.cats[k.key].facts.find(f => f[0] === l) || [])[1], (B.cats[k.key].facts.find(f => f[0] === l) || [])[1]]))];
    table = `<table class="cmp"><thead><tr><th scope="col"><span class="visually-hidden">Measure</span></th><th scope="col"><a href="#/county/${A.slug}">${esc(A.name)}</a></th><th scope="col"><a href="#/county/${B.slug}">${esc(B.name)}</a></th></tr></thead><tbody>
      ${rows.map(([l, x, y]) => l === "Drought" && !x && !y && state.droughtDate ? `<tr><th scope="row">Drought (week of ${esc(droughtWeek())})</th><td>${droughtTag(A.drought)}</td><td>${droughtTag(B.drought)}</td></tr>` : `<tr><th scope="row">${l}</th><td>${gradeEl(x)}</td><td>${gradeEl(y)}</td></tr>`).join("")}
      ${facts.map(([l, x, y]) => `<tr><th scope="row">${esc(l)}</th><td>${esc(fmt(x ?? "—"))}</td><td>${esc(fmt(y ?? "—"))}</td></tr>`).join("")}</tbody></table>`;
  }
  return `<h1>Compare two counties</h1><p class="lede">Put your county next to a neighbor, or next to anywhere in Texas.</p>
    <div class="compare-pick"><label>First county<select id="ca">${opts(a)}</select></label><label>Second county<select id="cb">${opts(b)}</select></label></div>${table}`;
}
function afterCompare() {
  const go = () => { const a = $("#ca").value, b = $("#cb").value; location.hash = `#/compare/${a}/${b}`; };
  $("#ca").onchange = go; $("#cb").onchange = go;
}

function faqItems() {
  const q = [
    ["How are the grades decided?", ["Each county gets a letter grade from A to F in each category.",
      ["<b>Power:</b> the team grades how reliable power has been in the county, based on outage events.",
       "<b>Drought:</b> the grade follows the U.S. Drought Monitor level that covers at least half of the county that week, so it changes as the weekly map changes.",
       "<b>Data centers:</b> not graded yet, because our list only covers some companies so far.",
       "<b>Overall:</b> the average of the power and drought grades."],
      "How drought levels become grades:",
      ["No drought: <b>A</b>", "Abnormally dry (D0): <b>B</b>", "Moderate drought (D1): <b>C</b>", "Severe drought (D2): <b>D</b>", "Extreme or exceptional drought (D3 or D4): <b>F</b>"]]],
    ["Why does my county say “Not graded yet”?", "Data centers aren't graded yet. Our list only covers some companies so far, so a grade would make counties look better than they are. Until then, each county page shows the data centers in our list and a link to the Texas Tribune's search tool. A few counties are also missing a power grade while the team checks their data."],
    ["Will my water bill increase?", "We can't answer that for your home yet. Water rates are set by your local water utility, and drought, repairs and new demand can all push them up. Your utility's website or your most recent bill lists who to ask. Each county page shows its current drought level, one of the things that can push rates up."],
    ["What does the power grade measure?", "It reflects how reliable electricity has been in the county, based on outage events. It also shows how much electricity is generated in the county and how many power plants it has."],
    ["What can I do about what I see here?", "Go to a public meeting. Each county page has a \u201cSpeak to Your Representatives\u201d button listing your commissioners court, your county seat\u2019s city council and any groundwater district, with when they meet and where to find agendas. Texas law lets anyone speak about an item on the agenda."],
    ["Where does the information come from?", "Population figures are U.S. Census Bureau 2025 estimates. Power data comes from the team's research spreadsheet. Every source will be listed on the About page as the team adds data."],
  ];
  // An answer can be plain text, or a list of paragraphs and bullet lists (written here, so the bold tags are safe).
  const body = a => typeof a === "string" ? `<p>${esc(a)}</p>` : a.map(x => Array.isArray(x) ? `<ul class="faq-list">${x.map(li => `<li>${li}</li>`).join("")}</ul>` : `<p>${x}</p>`).join("");
  return q.map(([s, a]) => `<details><summary>${esc(s)}</summary>${body(a)}</details>`);
}
function pageFaq() { return `<div class="prose"><h1>Questions</h1><p class="lede">Plain answers about the grades and what they mean for you.</p></div><div style="margin-top:24px">${faqItems().join("")}</div>`; }
function pageLearn() {
  return `<div class="prose"><h1>Data centers 101</h1>
    <p class="lede">What data centers are, why they need so much power and water, and what they can mean for the people who live near them. These are guides from newsrooms, researchers and government that we found useful.</p></div>
    ${CONFIG.guides.map(g => `<section class="section guides"><h2 class="ruled">${esc(g.group)}</h2><ul class="guide-list">${g.items.map(x => `<li>
      <span class="guide-type">${esc(x.type)}</span>
      <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}<span class="ext" aria-hidden="true">↗</span></a>
      <p>${esc(x.about)}</p>
      <div class="meta">${esc(x.source)} · ${esc(x.date)}</div></li>`).join("")}</ul></section>`).join("")}
    <section class="section"><p class="see-all">Want to know about data centers in your county? <a href="#/map">Find your county on the map</a>. Each county page lists the data centers in our list and links to the Texas Tribune's search tool.</p></section>`;
}
function pageAbout() {
  return `<div class="prose"><h1>About In My Backyard</h1>
    <p class="lede">A guide to what's happening with power, drought and data centers in every Texas county, and what it means for the people who live there.</p>
    <p>Texas is growing fast. New data centers, a strained power grid and long droughts affect bills, water and daily life, but the information is scattered across dozens of agencies. In My Backyard brings it together by county, grades it, and explains what you can do about it.</p>
    <h2 style="margin-top:32px">Sources</h2>
    <p>Population: U.S. Census Bureau, 2025 estimates. Power: the team's research spreadsheet. County shapes: Texas Water Development Board. Neighboring states and Mexico on the map: U.S. Census Bureau and Natural Earth. ZIP codes: U.S. Census Bureau 2020 ZIP code to county relationship file. Public meetings: county and city websites (found through Wikidata) and the Texas Water Development Board's list and map of groundwater districts. Meeting schedules were read from those websites in November 2026; the team checks them by hand. Data centers: the team's list, starting with Meta's Texas sites, built from company announcements, builders' project pages and Texas Department of Licensing and Regulation construction filings; each site on a county page links to its sources. Data centers aren't graded yet. Counties with no data center information link to the Texas Tribune's data center search. Drought: U.S. Drought Monitor county statistics (National Drought Mitigation Center, USDA and NOAA), updated weekly; a county's status is the worst drought level covering at least half of it. Drought isn't graded yet.</p>
    <h2 style="margin-top:32px">How we pick stories</h2>
    <p>Each month we search Google News for stories from the last 30 days that mention a county or its towns along with power, water, drought, data centers or the environment. We keep a story only if its headline names one of those topics and either the place or a local outlet. Stories from the county's own newspapers come first. Local newspapers come from the Texas Press Association's 2023 directory. The team can also hand-pick stories, which appear at the top.</p></div>`;
}

/* ---------- router ---------- */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const page = parts[0] || "home";
  const app = $("#app");
  const pages = {
    home: [pageHome, afterHome], map: [pageMap, afterMap],
    county: [() => pageCounty(parts[1]), () => { wireStoryFilter($("#app")); wirePanel($("#app")); }], compare: [() => pageCompare(parts[1], parts[2]), afterCompare],
    faq: [pageFaq], about: [pageAbout], learn: [pageLearn],
  };
  const [render, after] = pages[page] || pages.home;
  app.innerHTML = render(); if (after) after(); wireSearch(app);
  const nav = page === "county" ? "map" : page;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const c = page === "county" && state.counties.find(x => x.slug === parts[1]);
  document.title = c ? `${c.name} County | In My Backyard` : "In My Backyard";
  document.body.classList.remove("drawer-open");
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { route(); $("#app").focus({ preventScroll: true }); });
load().then(route).catch(err => {
  console.error(err);
  $("#app").innerHTML = `<div class="error"><h2>The data didn't load</h2><p>The site couldn't read <code>${esc(CONFIG.dataUrl)}</code>. If you opened this file by double-clicking it, open it with <b>start.command</b> instead, so the site runs at a local web address.</p></div>`;
});

// Tribune search: copy the county name before the link opens, since their tool can't take a place in its link.
document.addEventListener("click", e => {
  const a = e.target.closest("a.tt-search"); if (!a) return;
  const q = a.dataset.q, hint = a.closest("p")?.nextElementSibling; if (!q) return;
  const done = ok => { if (hint && hint.classList.contains("tt-hint")) { hint.textContent = ok ? `We copied “${q}” for you. Paste it into the Tribune's search bar.` : `Type “${q}” into the Tribune's search bar.`; } };
  try { navigator.clipboard.writeText(q).then(() => done(true), () => done(false)); } catch { done(false); }
});
</script>
</body>
</html>
