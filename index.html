<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In My Backyard</title>
<meta name="description" content="How your Texas county is doing on power, water and data centers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F3; --surface:#FFFFFF; --ink:#1D2B2A; --muted:#566664; --line:#D3DBD7;
  --sky:#235F7D;
  --g-a:#1B6E6A; --g-b:#5FA38F; --g-c:#E2B84A; --g-d:#DD7A3A; --g-f:#B5402F; --g-none:#CDD5D1;
  --display:"Archivo",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--body)}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
.site-header{border-bottom:1px solid var(--line);background:var(--paper)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.wordmark{font:800 1.35rem/1 var(--display);font-stretch:112%;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.wordmark span{color:var(--g-a)}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
nav a{display:block;padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav a:hover:not([aria-current="page"]){background:#E3E9E6}

main{padding:40px 0 72px}
main:focus{outline:none}
.home-map svg{max-height:70vh}
#big-map svg{max-height:80vh;width:auto;max-width:100%;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0}
h1{font-weight:800;font-stretch:100%;font-size:clamp(2.3rem,6vw,4rem);letter-spacing:-.02em}
h2{font-weight:750;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.01em}
h3{font-weight:700;font-size:1.2rem}
.lede{font-size:1.15rem;color:var(--muted);max-width:38em;margin:14px 0 0}

/* search */
.search{margin-top:28px;max-width:560px}
.search label{display:block;font-weight:600;margin-bottom:8px}
.search-row{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:14px 16px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{font:700 1rem var(--body);padding:12px 20px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-block}
.btn-quiet{background:transparent;color:var(--ink)}
.search-msg{margin:10px 0 0;min-height:1.5em;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.choices button{font:600 .95rem var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--ink);background:var(--surface);cursor:pointer}
.try{margin-top:14px;color:var(--muted);font-size:.95rem}
.try a{font-weight:600}

/* home layout */
.home-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:860px){.home-grid{grid-template-columns:1fr}}
.home-map figcaption{font-size:.9rem;color:var(--muted);margin-top:6px}

/* map */
.map-box{position:relative}
.map-box svg{width:100%;height:auto;display:block}
.county{stroke:#fff;stroke-width:.5;cursor:pointer;transition:opacity .12s}
.county:hover,.county.is-active{stroke:var(--ink);stroke-width:1.6}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 6px 18px rgba(29,43,42,.16);font-size:.9rem;min-width:190px;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;z-index:5}
.tip.show{opacity:1;transform:none}
.tip strong{display:block;font:750 1.05rem var(--display);margin-bottom:6px}
.tip dl{display:grid;grid-template-columns:auto auto;gap:3px 14px;margin:0}
.tip dt{color:var(--muted)} .tip dd{margin:0;font-weight:700;text-align:right}
.tip .hint{margin-top:8px;color:var(--muted);font-size:.8rem}

.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:14px 0 0;padding:0;list-style:none;font-size:.9rem}
.legend li{display:flex;align-items:center;gap:6px}
.swatch{width:16px;height:16px;border-radius:3px;display:inline-block}

.layer-pick{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 8px}
.layer-pick button{font:600 .95rem var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.layer-pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.map-note{color:var(--muted);font-size:.95rem;margin:6px 0 0}

/* grade stamp */
.grade{font-family:var(--display);font-weight:900;font-stretch:62%;line-height:.82;letter-spacing:-.02em;color:var(--gc,var(--muted))}
.grade-none{font-weight:700;font-stretch:100%;font-size:1rem!important;line-height:1.3;color:var(--muted)}

/* county report */
.back{display:inline-block;margin-bottom:18px;font-weight:600}
.report-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:28px;border-bottom:3px solid var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px 24px;margin:14px 0 0;padding:0;list-style:none;color:var(--muted)}
.facts b{color:var(--ink)}
.overall{text-align:center}
.overall .grade{font-size:clamp(6rem,16vw,10rem)}
.overall p{margin:8px 0 0;font-size:.9rem;color:var(--muted);max-width:14em}
@media (max-width:600px){.report-head{grid-template-columns:1fr}.overall{text-align:left}}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:0}
@media (max-width:860px){.cats{grid-template-columns:1fr}}
.cat{padding:28px 24px 28px 0;border-bottom:1px solid var(--line)}
.cat+.cat{padding-left:24px;border-left:1px solid var(--line)}
@media (max-width:860px){.cat,.cat+.cat{padding:24px 0;border-left:0}}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cat .grade{font-size:4.6rem}
.cat dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:18px 0 0}
.cat dt{color:var(--muted)} .cat dd{margin:0;font-weight:700;text-align:right}
.means{margin:18px 0 0;padding:14px 16px;background:var(--surface);border-left:4px solid var(--gc,var(--line));border-radius:0 6px 6px 0}
.means h4{margin:0 0 4px;font:700 .95rem var(--body)}
.means p{margin:0}
.parts{list-style:none;margin:18px 0 0;padding:0}
.parts li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.parts .grade{font-size:2.2rem}
.pending{color:var(--muted);font-size:.95rem;margin:14px 0 0}

.section{margin-top:56px}
.stories{list-style:none;margin:18px 0 0;padding:0}
.stories li{padding:16px 0;border-top:1px solid var(--line)}
.stories a{font:700 1.15rem/1.3 var(--display);text-decoration:none;color:var(--ink)}
.stories a:hover{text-decoration:underline}
.stories .meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin-top:18px}
.tags{display:flex;gap:6px;margin-bottom:6px}
.tag{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:4px;background:#E3E9E6;color:var(--ink)}
.tag-local{background:var(--g-a);color:#fff}
h3.sub{margin-top:32px;font-size:1.1rem;color:var(--muted)}
.more-news{margin-top:28px;padding-top:18px;border-top:3px solid var(--ink);font-size:.95rem}
.more-news p{margin:6px 0}
.filter-empty{color:var(--muted)}
.locate{margin-top:10px;background:none;border:0;padding:0;font:600 .95rem var(--body);color:var(--sky);text-decoration:underline;cursor:pointer}

/* speak up: public meetings */
.jump{margin-top:16px;display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);font:600 .95rem var(--body);color:var(--ink);cursor:pointer;text-align:left}
.jump b{font-weight:700}
.jump:hover{background:#E3E9E6}
.speak{--band:#1D2B2A;--band-2:#283A38;--band-line:#3C514E;--band-text:#EAF0ED;--band-muted:#B5C4BF;--band-link:#9FD8C9;
  background:var(--band);color:var(--band-text);margin-top:56px;padding:44px 0 48px;border-radius:12px;scroll-margin-top:16px}
.speak .inner{padding:0 32px}
@media (max-width:600px){.speak .inner{padding:0 18px}}
.speak h2{color:#fff}
.speak .lede{color:var(--band-muted);font-size:1.05rem}
.speak a{color:var(--band-link)}
.speak :focus-visible{outline-color:var(--band-link)}
.bodies{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:28px}
.body{background:var(--band-2);border:1px solid var(--band-line);border-radius:10px;padding:20px;display:flex;flex-direction:column}
.body .kind{font-size:.85rem;color:var(--band-muted);margin:0 0 4px}
.body h3{color:#fff;font-size:1.2rem}
.body .decides{color:var(--band-muted);font-size:.92rem;margin:8px 0 0}
.body dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}
.body dt{color:var(--band-muted)} .body dd{margin:0}
.body .next{display:inline-block;margin-top:2px;padding:2px 8px;border-radius:4px;background:var(--g-c);color:var(--ink);font-weight:700;font-size:.88rem}
.body .links{margin-top:auto;padding-top:16px;display:flex;flex-wrap:wrap;gap:8px 16px;font-weight:600;font-size:.95rem}
.how{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding-top:24px;border-top:1px solid var(--band-line)}
.how h3{color:#fff;font-size:1rem;margin-bottom:4px}
.how p{margin:0;color:var(--band-muted);font-size:.93rem}
.speak .fine{margin:24px 0 0;color:var(--band-muted);font-size:.88rem}

/* compare */
.compare-pick{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:22px}
.compare-pick label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.compare-pick select{font:inherit;padding:10px 12px;border-radius:8px;border:2px solid var(--ink);background:var(--surface);min-width:200px}
table.cmp{width:100%;border-collapse:collapse;margin-top:24px;background:var(--surface)}
.cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
.cmp thead th{font:750 1.15rem var(--display)}
.cmp td .grade{font-size:2.4rem}

/* faq/about */
.prose{max-width:44em}
.prose p{margin:12px 0}
details{border-top:1px solid var(--line);padding:16px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{font:700 1.15rem var(--display);cursor:pointer}
details p{margin:10px 0 0;max-width:42em}

.site-footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.9rem}
.loading{color:var(--muted)}
.error{padding:16px;border-left:4px solid var(--g-f);background:var(--surface)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="#/">In My <span>Backyard</span></a>
    <nav aria-label="Main"><ul>
      <li><a href="#/" data-nav="home">Home</a></li>
      <li><a href="#/map" data-nav="map">Map</a></li>
      <li><a href="#/compare" data-nav="compare">Compare</a></li>
      <li><a href="#/faq" data-nav="faq">FAQ</a></li>
      <li><a href="#/about" data-nav="about">About</a></li>
    </ul></nav>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1"><p class="loading">Loading Texas counties…</p></main>
<footer class="site-footer"><div class="wrap">In My Backyard is a student prototype. Grades are drafts while the team adds data. <a href="#/about">How it works</a></div></footer>
<datalist id="county-list"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================================================
   SETTINGS — the team edits this part
   ============================================================ */
const CONFIG = {
  // The spreadsheet the site reads. Later this can be a published Google Sheet link (File > Share > Publish to web > .xlsx).
  dataUrl: "data/master.xlsx",
  // Column names in the first tab (matching ignores capitals and anything after the name, e.g. "Population (Census...)").
  columns: { county: "County", population: "Population", area: "Square Mileage" },
  // Each category: the column that holds its grade, and the facts to show under it.
  // A category whose grade column doesn't exist yet shows "Not graded yet".
  categories: [
    { key: "power", label: "Power", grade: "Reliability Grade",
      facts: [ ["Outage events", "Outage Events"], ["Power generated (past year)", "Net Generation"], ["Power plants", "Power Plants"] ] },
    { key: "water", label: "Water",
      grade: "Water Grade",
      parts: [ ["Quality", "Water Quality Grade"], ["Drought", "Drought Grade"], ["Capacity", "Water Capacity Grade"] ] },
    { key: "datacenters", label: "Data centers", grade: "Data Center Grade",
      facts: [ ["Data centers", "Data Centers"] ] },
  ],
  // Optional tab named "Stories" with columns: County, Title, Outlet, Link, Date, Topic. Use "Statewide" as the county for stories that apply everywhere.
  storiesTab: "Stories",
  // Public meetings for the "Where to speak up" section. One row per body: County, Type, Name, Schedule, Where, Agenda link, Website, Covers.
  meetingsUrl: "data/meetings.xlsx",
  // What each kind of body decides, shown under its name.
  bodyDecides: {
    "commissioners court": "Runs county government: the budget, county roads, burn bans, emergency plans and tax breaks for big projects like data centers and power plants outside city limits.",
    "city council": "Runs the city: zoning and new development inside city limits, and water and power rates where the city runs those utilities.",
    "groundwater district": "Permits water wells and sets how much groundwater can be pumped. Large pumping permits get a public hearing where residents can comment.",
    "subsidence district": "Limits groundwater pumping so the land doesn't sink, and issues well permits.",
  },
  // DRAFT plain-language text for each grade. The team should rewrite these.
  meaning: {
    power: {
      A: ["Power here has been among the most reliable in Texas.", "Keep a basic outage kit anyway: flashlights, charged batteries, water."],
      B: ["Power here is more reliable than most of Texas.", "Outages happen but are less common. Sign up for your utility's outage alerts."],
      C: ["Power reliability here is about average for Texas.", "Sign up for outage alerts and keep phones charged before storms."],
      D: ["Power here goes out more often than in most of Texas.", "Plan for outages during storms and heat waves: backup batteries, a cooling plan, and checking on neighbors."],
      F: ["Power here has been among the least reliable in Texas.", "Expect outages. Make a plan for medical devices, food storage and staying cool or warm, and ask your county about emergency centers."],
    },
  },
};

/* ============================================================
   Below here: how the site works
   ============================================================ */
const GRADE_COLORS = { A: "var(--g-a)", B: "var(--g-b)", C: "var(--g-c)", D: "var(--g-d)", F: "var(--g-f)" };
const GRADE_HEX = { A: "#1B6E6A", B: "#5FA38F", C: "#E2B84A", D: "#DD7A3A", F: "#B5402F", none: "#CDD5D1" };
const POINTS = { A: 4, B: 3, C: 2, D: 1, F: 0 };
const state = { counties: [], byName: new Map(), byFips: new Map(), zips: {}, topo: null, stories: [], layer: "overall" };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const norm = s => String(s || "").toLowerCase().replace(/\s+county$/, "").trim();
const fmt = v => (typeof v === "number" ? v.toLocaleString("en-US") : (v ?? ""));

function findCol(headers, name) {
  const n = name.toLowerCase();
  return headers.find(h => h.toLowerCase() === n) || headers.find(h => h.toLowerCase().startsWith(n));
}
function letter(v) { const m = String(v || "").trim().toUpperCase().match(/^[ABCDF]/); return m ? m[0] : null; }
// Average of grade points -> letter with + or -. A whole number gives a plain letter (one B = "B").
function toLetterPlusMinus(avg) {
  const whole = Math.round(avg), diff = avg - whole;
  const base = ["F", "D", "C", "B", "A"][whole];
  if (base === "F") return "F";
  if (diff >= 0.17 && base !== "A") return base + "+";
  if (diff <= -0.17) return base + "-";
  return base;
}

async function load() {
  const [buf, topo, zips] = await Promise.all([
    fetch(CONFIG.dataUrl, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("spreadsheet"); return r.arrayBuffer(); }),
    fetch("data/tx-counties.json").then(r => r.json()),
    fetch("data/tx-zips.json").then(r => r.json()),
  ]);
  state.topo = topo; state.zips = zips;
  const wb = XLSX.read(buf, { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
  const headers = rows.length ? Object.keys(rows[0]) : [];
  const col = k => findCol(headers, k);
  const cCounty = col(CONFIG.columns.county);

  const fipsByName = new Map(topo.objects.counties.geometries.map(g => [norm(g.properties.name), g.id]));
  for (const r of rows) {
    const name = r[cCounty]; if (!name || !String(name).trim()) continue;
    const c = { name: String(name).trim(), population: r[col(CONFIG.columns.population)], area: r[col(CONFIG.columns.area)], cats: {} };
    c.slug = slug(c.name); c.fips = fipsByName.get(norm(c.name));
    for (const cat of CONFIG.categories) {
      const entry = { grade: null, facts: [], parts: [] };
      const gc = cat.grade && col(cat.grade);
      if (gc) entry.grade = letter(r[gc]);
      for (const [label, k] of cat.facts || []) { const fc = col(k); if (fc && r[fc] != null && r[fc] !== "") entry.facts.push([label, r[fc]]); }
      for (const [label, k] of cat.parts || []) { const pc = col(k); entry.parts.push([label, pc ? letter(r[pc]) : null]); }
      // a category with sub-parts but no grade of its own: average the parts
      if (!entry.grade && entry.parts.some(p => p[1])) {
        const g = entry.parts.filter(p => p[1]).map(p => POINTS[p[1]]);
        entry.grade = toLetterPlusMinus(g.reduce((a, b) => a + b, 0) / g.length)[0];
      }
      c.cats[cat.key] = entry;
    }
    const graded = CONFIG.categories.filter(k => c.cats[k.key].grade);
    c.gradedLabels = graded.map(k => k.label);
    c.overall = graded.length ? toLetterPlusMinus(graded.reduce((a, k) => a + POINTS[c.cats[k.key].grade], 0) / graded.length) : null;
    state.counties.push(c); state.byName.set(norm(c.name), c); if (c.fips) state.byFips.set(c.fips, c);
  }
  state.counties.sort((a, b) => a.name.localeCompare(b.name));
  $("#county-list").innerHTML = state.counties.map(c => `<option value="${esc(c.name)} County">`).join("");

  const st = wb.SheetNames.find(n => n.toLowerCase() === CONFIG.storiesTab.toLowerCase());
  if (st) state.stories = XLSX.utils.sheet_to_json(wb.Sheets[st], { defval: "" }).filter(s => s.Title);

  // Neighboring counties (for "nearby" stories)
  const geoms = topo.objects.counties.geometries, nb = topojson.neighbors(geoms);
  state.neighbors = new Map(geoms.map((g, i) => [g.id, nb[i].map(j => geoms[j].id)]));

  // Found stories and local outlets (made by scripts/fetch_stories.py). The site still works without them.
  const opt = u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
  const optXlsx = u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
  let mbuf;
  [state.news, state.outlets, mbuf] = await Promise.all([opt("data/stories.json"), opt("data/outlets.json"), optXlsx(CONFIG.meetingsUrl)]);
  state.meetings = new Map();
  if (mbuf) {
    const mwb = XLSX.read(mbuf, { type: "array" });
    for (const m of XLSX.utils.sheet_to_json(mwb.Sheets[mwb.SheetNames[0]], { defval: "" })) {
      if (!m.County || !m.Name) continue;
      const k = norm(m.County);
      if (!state.meetings.has(k)) state.meetings.set(k, []);
      state.meetings.get(k).push(m);
    }
  }
}

/* ---------- small pieces ---------- */
function gradeEl(g, cls = "") {
  if (!g) return `<span class="grade grade-none ${cls}">Not graded yet</span>`;
  return `<span class="grade ${cls}" style="--gc:${GRADE_COLORS[g[0]]}" aria-label="Grade ${g}">${esc(g)}</span>`;
}
function layerGrade(c, layer) {
  if (!c) return null;
  return layer === "overall" ? c.overall : c.cats[layer]?.grade;
}

/* ---------- map ---------- */
function drawMap(el, { interactive = true, height = 0 } = {}) {
  const geo = topojson.feature(state.topo, state.topo.objects.counties);
  const W = 800, H = height || 760;
  const proj = d3.geoConicEqualArea().parallels([27.5, 35]).rotate([100, 0]).fitSize([W, H], geo);
  const path = d3.geoPath(proj);
  el.innerHTML = `<div class="map-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of Texas counties colored by grade"></svg><div class="tip" role="status"></div></div>`;
  const svg = d3.select(el).select("svg"), tip = $(".tip", el), box = $(".map-box", el);
  const paths = svg.append("g").selectAll("path").data(geo.features).join("path")
    .attr("class", "county").attr("d", path);
  const paint = () => paths.attr("fill", f => { const g = layerGrade(state.byFips.get(f.id), state.layer); return g ? GRADE_HEX[g[0]] : GRADE_HEX.none; });
  paint();
  if (!interactive) { paths.on("click", (e, f) => { const c = state.byFips.get(f.id); if (c) location.hash = `#/county/${c.slug}`; }); return { paint }; }

  const show = (e, f) => {
    const c = state.byFips.get(f.id); if (!c) return;
    paths.classed("is-active", d => d === f);
    const rows = [["Overall", c.overall], ...CONFIG.categories.map(k => [k.label, c.cats[k.key].grade])];
    tip.innerHTML = `<strong>${esc(c.name)} County</strong><dl>${rows.map(([l, g]) => `<dt>${l}</dt><dd>${g ? esc(g) : "—"}</dd>`).join("")}</dl><div class="hint">Click to see the full report</div>`;
    const r = box.getBoundingClientRect();
    let x = e.clientX - r.left + 16, y = e.clientY - r.top + 16;
    if (x + 220 > r.width) x = e.clientX - r.left - 220;
    if (y + 190 > r.height) y = e.clientY - r.top - 190;
    tip.style.left = Math.max(0, x) + "px"; tip.style.top = Math.max(0, y) + "px"; tip.classList.add("show");
  };
  paths.on("mousemove", show)
    .on("mouseleave", () => { tip.classList.remove("show"); paths.classed("is-active", false); })
    .on("click", (e, f) => { const c = state.byFips.get(f.id); if (c) location.hash = `#/county/${c.slug}`; });
  return { paint };
}
function legendHtml() {
  return `<ul class="legend">${["A","B","C","D","F"].map(g => `<li><span class="swatch" style="background:${GRADE_HEX[g]}"></span>${g}</li>`).join("")}<li><span class="swatch" style="background:${GRADE_HEX.none}"></span>Not graded yet</li></ul>`;
}

function searchHtml(id = "q") {
  return `<form class="search" data-search>
    <label for="${id}">Enter your ZIP code or county</label>
    <div class="search-row"><input id="${id}" list="county-list" autocomplete="off" inputmode="search" placeholder="78701 or Travis County"><button class="btn" type="submit">See my county</button></div>
    <button type="button" class="locate">Use my location</button>
    <p class="search-msg" aria-live="polite"></p><div class="choices"></div></form>`;
}
function wireSearch(root) {
  root.querySelectorAll("[data-search]").forEach(form => {
    $(".locate", form).onclick = () => {
      const msg = $(".search-msg", form);
      if (!navigator.geolocation) { msg.textContent = "Your browser can't share your location. Type your ZIP code instead."; return; }
      msg.textContent = "Finding your county…";
      navigator.geolocation.getCurrentPosition(pos => {
        const pt = [pos.coords.longitude, pos.coords.latitude];
        const f = topojson.feature(state.topo, state.topo.objects.counties).features.find(f => d3.geoContains(f, pt));
        const c = f && state.byFips.get(f.id);
        if (c) location.hash = `#/county/${c.slug}`;
        else msg.textContent = "Your location looks like it's outside Texas. Type a Texas ZIP code or county instead.";
      }, () => { msg.textContent = "We couldn't get your location. Type your ZIP code instead."; }, { timeout: 10000 });
    };
    form.addEventListener("submit", e => {
      e.preventDefault();
      const v = $("input", form).value.trim(), msg = $(".search-msg", form), ch = $(".choices", form);
      ch.innerHTML = ""; msg.textContent = "";
      if (!v) { msg.textContent = "Type a 5-digit ZIP code or a county name."; return; }
      if (/^\d{5}$/.test(v)) {
        const list = (state.zips[v] || []).map(f => state.byFips.get(f)).filter(Boolean);
        if (!list.length) { msg.textContent = `ZIP code ${v} isn't in our Texas list. Check the number, or search by county name.`; return; }
        if (list.length === 1) { location.hash = `#/county/${list[0].slug}`; return; }
        msg.textContent = `ZIP code ${v} crosses ${list.length} counties. Pick yours:`;
        ch.innerHTML = list.map(c => `<button type="button" data-go="${c.slug}">${esc(c.name)} County</button>`).join("");
        ch.querySelectorAll("button").forEach(b => b.onclick = () => location.hash = `#/county/${b.dataset.go}`);
        return;
      }
      const c = state.byName.get(norm(v)) || state.counties.find(c => norm(c.name).startsWith(norm(v)));
      if (c) location.hash = `#/county/${c.slug}`;
      else msg.textContent = `No Texas county matches "${v}". Check the spelling, or try a ZIP code.`;
    });
  });
}

// Team-picked stories (spreadsheet "Stories" tab) come first, then found stories for the county.
function storiesFor(c) {

    .map(s => ({ title: s.Title, url: s.Link, source: s.Outlet, date: s.Date, category: s.Topic || "", picked: true }));

/* ---------- where to speak up: public meetings ---------- */
const DAYNAMES = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
const WEEKWORDS = { "1st": 1, first: 1, "2nd": 2, second: 2, "3rd": 3, third: 3, "4th": 4, fourth: 4, last: 5 };
// Next date from a schedule like "2nd and 4th Monday of the month, 9 a.m." or "Every Tuesday". Returns null when it can't tell.
function nextMeeting(schedule, from = new Date()) {
  const s = String(schedule || "").toLowerCase();
  const dm = s.match(/\b(monday|tuesday|wednesday|thursday|friday)/); if (!dm || /every other|other week|biweekly/.test(s)) return null;
  const dow = DAYNAMES.indexOf(dm[1]);
  const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  if (/\bevery\b/.test(s.slice(0, dm.index))) {
    const d = new Date(today); d.setDate(d.getDate() + ((dow - d.getDay() + 7) % 7)); return d;
  }
  const weeks = [...s.slice(0, dm.index).matchAll(/\b(1st|2nd|3rd|4th|first|second|third|fourth|last)\b/g)].map(m => WEEKWORDS[m[1]]);
  if (!weeks.length) return null;
  const dates = [];
  for (let add = 0; add < 3; add++) {
    const y = today.getFullYear(), mo = today.getMonth() + add;
    const first = new Date(y, mo, 1), offset = (dow - first.getDay() + 7) % 7;
    for (const w of weeks) {
      let d = new Date(y, mo, 1 + offset + (w === 5 ? 4 : w - 1) * 7);
      if (w === 5 && d.getMonth() !== new Date(y, mo, 1).getMonth()) d.setDate(d.getDate() - 7);
      if (d.getMonth() === new Date(y, mo, 1).getMonth() && d >= today) dates.push(d);
    }
  }
  return dates.sort((a, b) => a - b)[0] || null;
}
const longDate = d => {
  const t = new Date(), s = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  return d.toDateString() === t.toDateString() ? `Today, ${s}` : s;
};
const searchLink = q => `https://www.google.com/search?q=${encodeURIComponent(q)}`;
const TYPE_ORDER = ["commissioners court", "city council", "groundwater district", "subsidence district"];
function meetingsFor(c) {
  return (state.meetings?.get(norm(c.name)) || []).slice()
    .sort((a, b) => (TYPE_ORDER.indexOf(String(a.Type).toLowerCase()) + 1 || 9) - (TYPE_ORDER.indexOf(String(b.Type).toLowerCase()) + 1 || 9));
}
// The soonest meeting we can work out, for the link at the top of the page.
function soonestMeeting(c) {
  return meetingsFor(c).map(m => ({ m, d: nextMeeting(m.Schedule) })).filter(x => x.d).sort((a, b) => a.d - b.d)[0] || null;
}
function bodyCard(m) {
  const type = String(m.Type || "").trim(), t = type.toLowerCase();
  const next = nextMeeting(m.Schedule);
  const when = m.Schedule
    ? `${esc(m.Schedule)}${next ? `<br><span class="next">Next: ${esc(longDate(next))}</span>` : ""}`
    : (t.includes("district") ? "Check the district's website for board meetings and permit hearings." : "Check the agenda page. Agendas are posted at least 72 hours before each meeting.");
  const agenda = m["Agenda link"] || m.Website, site = m.Website;
  const links = [
    agenda ? `<a href="${esc(agenda)}" target="_blank" rel="noopener">${t.includes("district") ? "Visit the website" : "See agendas"}</a>`
           : `<a href="${esc(searchLink(m.Name + " agenda"))}" target="_blank" rel="noopener">Search for agendas</a>`,
    site && agenda && site !== agenda ? `<a href="${esc(site)}" target="_blank" rel="noopener">Main website</a>` : "",
  ].filter(Boolean).join("");
  const covers = m.Covers && !/^whole county$/i.test(m.Covers) ? `<dt>Covers</dt><dd>${esc(m.Covers)}</dd>` : "";
  return `<article class="body">
    <p class="kind">${esc(type)}</p><h3>${esc(m.Name)}</h3>

    <dl><dt>When</dt><dd>${when}</dd>${m.Where ? `<dt>Where</dt><dd>${esc(m.Where)}</dd>` : ""}${covers}</dl>

}
function speakUpSection(c) {

function faqItems() {
  const q = [
    ["How are the grades decided?", "Each county gets a letter grade from A to F for power, water and data centers, based on the data the team has gathered. The overall grade averages the categories a county has grades for. Right now only power is graded, so the overall grade matches the power grade."],
    ["Why does my county say “Not graded yet”?", "The team is still collecting water and data center data for all 254 Texas counties. Grades appear as soon as that data is added."],
    ["Will my water bill increase?", "We can't answer that for your home yet. Water rates are set by your local water utility, and drought, repairs and new demand can all push them up. Your utility's website or your most recent bill lists who to ask. We plan to add water information for every county."],
    ["What does the power grade measure?", "It reflects how reliable electricity has been in the county, based on outage events. It also shows how much electricity is generated in the county and how many power plants it has."],
    ["What can I do about what I see here?", "Go to a public meeting. Each county page has a \u201cWhere to speak up\u201d section listing your commissioners court, your county seat\u2019s city council and any groundwater district, with when they meet and where to find agendas. Texas law lets anyone speak about an item on the agenda."],
    ["Where does the information come from?", "Population figures are U.S. Census Bureau 2025 estimates. Power data comes from the team's research spreadsheet. Every source will be listed on the About page as the team adds data."],
  ];
  return q.map(([s, a]) => `<details><summary>${esc(s)}</summary><p>${esc(a)}</p></details>`);
}
function pageFaq() { return `<div class="prose"><h1>Questions</h1><p class="lede">Plain answers about the grades and what they mean for you.</p></div><div style="margin-top:24px">${faqItems().join("")}</div>`; }
function pageAbout() {
  return `<div class="prose"><h1>About In My Backyard</h1>
    <p class="lede">A guide to what's happening with power, water and data centers in every Texas county, and what it means for the people who live there.</p>
    <p>Texas is growing fast. New data centers, a strained power grid and long droughts affect bills, water and daily life, but the information is scattered across dozens of agencies. In My Backyard brings it together by county, grades it, and explains what you can do about it.</p>
    <h2 style="margin-top:32px">Sources</h2>
    <p>Population: U.S. Census Bureau, 2025 estimates. Power: the team's research spreadsheet. County shapes: Texas Water Development Board. ZIP codes: U.S. Census Bureau 2020 ZIP code to county relationship file. Public meetings: county and city websites (found through Wikidata) and the Texas Water Development Board's list and map of groundwater districts. Meeting schedules were read from those websites in November 2026; the team checks them by hand. Water and data center sources will be listed here as they're added.</p>
    <h2 style="margin-top:32px">How we pick stories</h2>
    <p>Each month we search Google News for stories from the last 30 days that mention a county or its towns along with power, water, drought, data centers or the environment. We keep a story only if its headline names one of those topics and either the place or a local outlet. Stories from the county's own newspapers come first. Local newspapers come from the Texas Press Association's 2023 directory. The team can also hand-pick stories, which appear at the top.</p></div>`;
}

/* ---------- router ---------- */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const page = parts[0] || "home";
  const app = $("#app");
  const pages = {
    home: [pageHome, afterHome], map: [pageMap, afterMap],
    county: [() => pageCounty(parts[1]), () => { wireStoryFilter($("#app")); wireJump($("#app")); }], compare: [() => pageCompare(parts[1], parts[2]), afterCompare],
    faq: [pageFaq], about: [pageAbout],
  };
  const [render, after] = pages[page] || pages.home;
  app.innerHTML = render(); if (after) after(); wireSearch(app);
  const nav = page === "county" ? "map" : page;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const c = page === "county" && state.counties.find(x => x.slug === parts[1]);
  document.title = c ? `${c.name} County | In My Backyard` : "In My Backyard";
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { route(); $("#app").focus({ preventScroll: true }); });
load().then(route).catch(err => {
  console.error(err);
  $("#app").innerHTML = `<div class="error"><h2>The data didn't load</h2><p>The site couldn't read <code>${esc(CONFIG.dataUrl)}</code>. If you opened this file by double-clicking it, open it with <b>start.command</b> instead, so the site runs at a local web address.</p></div>`;
});
</script>
</body>
</html>
